services:
  postgres:
    image: postgres:16-alpine
    container_name: careplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careplus_user
      POSTGRES_PASSWORD: careplus_password
      POSTGRES_DB: careplus_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careplus_user -d careplus_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: careplus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careplus_user:careplus_password@postgres:5432/careplus_monitor
      PROJECT_NAME: "CarePlus Service Health Monitoring Dashboard"
      SECRET_KEY: "careplus_secret_key_super_secure_enterprise_grade_health_monitor_2026"
      ALLOW_PRIVATE_NETWORKS: "False"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: careplus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
